services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dograh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dograh}
    volumes:
      - dograh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - dograh-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    environment:
      SERVICE_URL_MINIO_9000: /
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_UI_URL:-${SERVICE_URL_UI_3010:-http://localhost:3010}}
    volumes:
      - dograh-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  dograh-init:
    image: busybox:1.36
    volumes:
      - coturn-generated:/generated/coturn
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /generated/coturn
        cat > /generated/coturn/turnserver.conf <<EOF
        listening-port=3478
        tls-listening-port=5349
        min-port=49152
        max-port=49200
        external-ip=${TURN_HOST:?Set TURN_HOST}
        realm=dograh.com
        use-auth-secret
        static-auth-secret=${TURN_SECRET:?Set TURN_SECRET}
        fingerprint
        no-cli
        no-multicast-peers
        log-file=stdout
        EOF
        echo "dograh-init: turnserver.conf written"
    restart: "no"

  coturn:
    image: coturn/coturn:4.8.0
    restart: unless-stopped
    depends_on:
      dograh-init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - coturn-generated:/etc/coturn:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - speaches-hf-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8000))'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  api:
    image: ghcr.io/dograh-hq/dograh-api:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      SERVICE_URL_API_8000: /
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_FILE: "false"
      BACKEND_API_ENDPOINT: ${PUBLIC_BACKEND_URL:-${SERVICE_URL_API_8000:-http://localhost:8000}}
      UI_APP_URL: ${PUBLIC_UI_URL:-${SERVICE_URL_UI_3010:-http://localhost:3010}}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dograh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dograh}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENABLE_AWS_S3: ${ENABLE_AWS_S3:-false}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_MINIO_URL:-${SERVICE_URL_MINIO_9000:-http://localhost:9000}}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-voice-audio}
      MINIO_SECURE: "false"
      OSS_JWT_SECRET: ${OSS_JWT_SECRET:?Set OSS_JWT_SECRET}
      FASTAPI_WORKERS: "1"
      ARQ_WORKERS: ${ARQ_WORKERS:-1}
      TURN_HOST: ${TURN_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
      FORCE_TURN_RELAY: ${FORCE_TURN_RELAY:-false}
      ENABLE_TELEMETRY: "false"
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      SENTRY_DSN: ""
      LANGFUSE_SECRET_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_HOST: ""
    volumes:
      - dograh-tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  ui:
    image: ghcr.io/dograh-hq/dograh-ui:latest
    restart: unless-stopped
    expose:
      - "3010"
    environment:
      SERVICE_URL_UI_3010: /
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-${SERVICE_URL_API_8000:-http://localhost:8000}}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_TELEMETRY: "false"
      POSTHOG_KEY: ""
      POSTHOG_HOST: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3010', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  dograh-postgres:
  dograh-redis:
  dograh-minio:
  dograh-tmp:
  coturn-generated:
  speaches-hf-cache:
